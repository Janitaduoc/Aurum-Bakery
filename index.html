<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
            name="description"
            content="Aurum Bakery, tu pastelería artesanal de alta costura."
    />
    <title>Aurum Bakery | El sabor del oro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
            rel="stylesheet"
    />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />


</head>
<body>
<custom-header active-page="inicio"></custom-header>

<main id="inicio">
    <div class="container mt-5">
        <section class="hero-section mb-5">
            <div class="hero-copy text-center mb-4">
                <h1>Descubre <em>el sabor del oro</em> en cada bocado.</h1>
                <p class="lead mt-3">"Donde la pastelería se convierte en arte."</p>
            </div>

            <div id="carouselBakery" class="carousel slide shadow-sm" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselBakery" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselBakery" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselBakery" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img
                                src="https://images.unsplash.com/photo-1550617931-e17a7b70dce2?auto=format&fit=crop&w=1200&q=80"
                                class="d-block w-100"
                                alt="Muffins"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                                src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1200&q=80"
                                class="d-block w-100"
                                alt="Hogazas recién horneados"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                                src="https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?auto=format&fit=crop&w=1200&q=80"
                                class="d-block w-100"
                                alt="Cupcakes de colores pasteles"
                        />
                    </div>

                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselBakery" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselBakery" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>

            <div class="text-center mt-5">
                <a class="btn btn-primary btn-lg px-5 py-3" href="catalogo.html">Ver nuestro catálogo</a>
            </div>
        </section>

        <hr class="my-5 opacity-25">


    </div>
</main>

<custom-footer></custom-footer>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>
<script src="js/components/layout.js"></script>
</body>
</html>
