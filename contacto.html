
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Aurum Bakery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
            rel="stylesheet"
    />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<custom-header active-page="contacto"></custom-header>

<main>
    <div class="container mt-5 text-center">
        <p class="eyebrow">Hablemos</p>
        <h1>Ponte en <em>contacto</em> con nosotros</h1>
        <p class="lead mt-3">
            ¿Tienes dudas, pedidos especiales o quieres cotizar un evento?
            Escríbenos y te responderemos a la brevedad.
        </p>

        <form class="mx-auto mt-4 text-start" style="max-width: 600px;">
            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label" for="mensaje">Mensaje</label>
                <textarea class="form-control" id="mensaje" rows="4" placeholder="Cuéntanos qué necesitas"></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg px-5">Enviar mensaje</button>
            </div>
        </form>
    </div>
</main>

<custom-footer></custom-footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/components/layout.js"></script>
</body>
</html>
